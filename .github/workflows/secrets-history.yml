# gitleaks over every commit on every branch and tag, daily and independent of
# pushes. verify and deploy scan the history of the commit they check; this
# also covers branches never opened as a PR, and rescans unchanged history
# when gitleaks' rules change. Run it by hand from the Actions tab
# (secrets-history → Run workflow) after a history rewrite.
name: secrets-history

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

# The job's token can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: secrets-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: [self-hosted, grc]
    timeout-minutes: 15
    steps:
      # Pinned by commit SHA; see verify.yml. fetch-depth 0: every commit on
      # every branch and tag, which is what --all scans.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Our own script, no npm: gitleaks runs in its locked-down container.
      - run: node scripts/scan-secrets.mjs --all
