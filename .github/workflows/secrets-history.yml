# gitleaks over every commit on every ref, on a schedule and independent of pushes: the pr
# tier scans only a PR's own commits (base..head), so this is what finds a secret that
# reached history any other way. The secret-scanner canary runs first, through the same
# scanner and rules. The shared engine (jklepp/ci) requires this workflow: its `workflows`
# check fails without a scheduled `command: secrets-history`. Run it by hand from Actions
# (secrets-history → Run workflow), at onboarding and after a history rewrite.
name: secrets-history

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

# The job's token can read the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: secrets-history
  cancel-in-progress: false

jobs:
  history:
    runs-on: [self-hosted, grc]
    timeout-minutes: 15
    steps:
      # fetch-depth 0: every commit on every branch and tag, which is what gitleaks reads.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jklepp/ci@9a3bd9205b41e70f7ed457734e571472b13c47d0
        with:
          command: secrets-history
      - if: always()
        uses: jklepp/ci@9a3bd9205b41e70f7ed457734e571472b13c47d0
        with:
          command: sweep
