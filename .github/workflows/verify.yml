# Runs `npm run verify` (scripts/verify.mjs) on the self-hosted runner: the
# same checks as the pre-push hook, but on a fresh checkout this machine's
# working copy cannot influence, and on triggers the hook never sees.
#
# On GitHub Free a private repo has no branch protection, so a red run here
# does not block a merge. It is the independent record; the hook is the gate.
name: verify

on:
  pull_request:
  # Pushes to main are checked by deploy.yml, which runs verify before it
  # publishes; running it here too would check every merge twice.
  # No schedule: turned off by choice. Run it by hand from the Actions tab, or
  # `npm run verify` locally, to check unchanged code against new advisories.
  workflow_dispatch:

# The job's GITHUB_TOKEN can read the repo and nothing else, so even a
# compromised step cannot push, tag, or touch releases.
permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: [self-hosted, grc]
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit, not a tag: in March 2026 trivy-action's
      # tags were rewritten to point at an infostealer. The comment names the
      # release for humans; bump both together, after a cooldown.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Default true writes the token into .git/config, where every later
          # step — npm ci and its dependencies included — could read it.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci
      - run: npm run verify

      # Keep verify's full output on the runner, not on GitHub: the repo is
      # public, and so would an uploaded artifact be. checkout wipes the
      # workspace each run, so the copy goes outside it. always(): a failed
      # run is the one whose log matters most. Logs older than 90 days are
      # pruned, matching what GitHub would have kept.
      - name: Keep verify log on the runner
        if: always()
        run: |
          dir="$HOME/verify-logs"
          mkdir -p "$dir"
          if [ -f logs/verify.log ]; then
            cp logs/verify.log "$dir/$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_WORKFLOW-$GITHUB_RUN_ID-${GITHUB_SHA:0:7}.log"
          fi
          find "$dir" -name '*.log' -mtime +90 -delete
