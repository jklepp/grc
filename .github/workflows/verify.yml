# The pr tier on every pull request, on the self-hosted runner, run by the shared CI engine
# (jklepp/ci) from the stages in ci.toml. Run it by hand (Actions → verify → Run workflow) with
# `full` ticked for the full tier: the pr tier, with gitleaks over all history.
#
# The merge gate: the "Protect main" ruleset requires this `verify` check to pass on an
# up-to-date branch. Pushes to main are checked by deploy.yml before it publishes.
name: verify

on:
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Full tier (gitleaks over all history, and the full-tier stages)
        type: boolean
        default: false

# The job's token can read the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Never a fork's code on this runner (a public repository): it runs host scripts as the
    # runner user. The repository's fork-PR approval setting is the other half.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, grc]
    timeout-minutes: 30
    steps:
      # Every action is pinned to a commit, not a tag: tags can be repointed. The engine's
      # `workflows` stage fails CI otherwise, and fails if the jklepp/ci pins differ.
      # fetch-depth 0: gitleaks and the signatures skip compare against the base.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Sweeps leftovers, then verifies this commit. The PR's base, not origin/main, so a stale
      # branch is checked against what it will merge into.
      - uses: jklepp/ci@9a3bd9205b41e70f7ed457734e571472b13c47d0
        with:
          command: verify
          full: ${{ inputs.full && 'true' || 'false' }}
          base: origin/${{ github.base_ref || 'main' }}

      # A cancelled or timed-out job never reaches verify's own cleanup.
      - if: always()
        uses: jklepp/ci@9a3bd9205b41e70f7ed457734e571472b13c47d0
        with:
          command: sweep
