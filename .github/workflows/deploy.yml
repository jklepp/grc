name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # check:validators is what proves the validators still fire — it hands
      # them 58 deliberately broken graphs and fails if any is accepted, and
      # loads the real dataset through loadGraph as its baseline, so a bad
      # fact set fails here.
      #
      # (This used to say the graph was built at module scope during `vite
      # build`, which stopped being true when the engine became async.)
      - run: npm run check
      - run: npm run build
      # After the build, because it reads dist/.vite/manifest.json. Route
      # splitting and the deferred PDF path are invariants a single stray
      # static import would undo silently; this fails the build instead.
      - run: npm run check:bundle
      # The manifest is build metadata for the gate above, not something the
      # site needs — and it lists every source path. Drop it before publish.
      - run: rm -rf dist/.vite
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
