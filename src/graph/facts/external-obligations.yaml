# Security and data terms owed to outside parties that are stricter than ACME's
# default (control-defaults.yaml). A term that matches or is looser than the
# default is already met by the control and does not belong here; the
# validator refuses it. See src/graph/nodes/externalObligations.ts.
#
# Scope is NOT listed: the systems an obligation reaches are derived from
# dataTypeIds. Status is NOT listed either: each proof is checked against the
# evidence or tabletop facts it names.
#
# Authored directly; there is no generating TypeScript source. Customers are
# bracketed placeholders, and all terms are illustrative demo data.

