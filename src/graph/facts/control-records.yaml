# Each system's own control records — the framework baseline for systems without
# HITRUST in scope (src/graph/nodes/controlRecords.ts). One row is either the whole
# of a system-specific control or the system's part of a hybrid one (see
# common-controls.yaml). An applicable control with no row here, no common record
# and no inheritance is unassessed: reported, not scored as zero.


