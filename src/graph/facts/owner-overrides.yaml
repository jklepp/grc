# Where one asset/control pair is owned by someone other than the system+category
# default in ownership.yaml. That default exists because ownership genuinely tracks team
# and platform rather than individual resource — but not always: within a single system
# and category, one asset can be operated by a different team than the rest. The KMS
# key's administration is PIM-gated and run directly by Cloud Security even though Data
# Protection on SYS-003 otherwise defaults to Data Platform + IT Security. That is a
# real split in who-runs-this, not a split in maturity or evidence, which is why it
# lives here rather than being forced into an implementation override. Requires a note
# saying why.
#
# Generated by scripts/export-facts-to-yaml.mjs. Edit this file, not a TypeScript module.

- assetId: "AST-003-07"
  controlId: "CRY-09"
  ownerIds:
    - "cloud-security"
  note: "Key administration is MFA-gated through PIM and run directly by Cloud Security, not the Data
    Platform/IT Security pair that owns Data Protection defaults elsewhere on this system."
