# Authenticated AI agents operating inside a system boundary. These are not
# model endpoints and not generic workload totals: each row is an agent with
# an action scope, service principal, credential posture, and accountable owner.

- id: "AGENT-003-SUPPORT"
  systemId: "SYS-003"
  name: "Customer Support Resolution Agent"
  purpose: "Retrieves approved customer context and drafts support resolutions for human approval."
  ownerOrgId: "product-security"
  servicePrincipal: "spn://prod-ai/support-resolution-agent"
  autonomyLevel: "approval-gated"
  humanApprovalRequired: true
  externalActions: false
  canImpersonateUser: false
  privilegeLevel: "standard"
  credentialType: "workload-identity"
  credentialCreatedAt: "2025-11-12"
  lastUsedAt: "2026-08-17"
  loggingEnabled: true
  revocationMechanism: "automated"
  tools:
    - "Knowledge Search"
    - "Case Drafting"
  active: true

