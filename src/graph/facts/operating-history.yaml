# HITRUST-style operating-history gate (see ControlOperatingHistory in
# src/graph/edges/controlImplementations.ts). Authored sparsely, on purpose:
# a pair with no record here is untracked, not treated as newly implemented,
# so the vast majority of the assessed estate is unaffected by this file.
#
# Unlike most fact files, this one has no generating TypeScript source — it is
# a new concept, authored directly.

