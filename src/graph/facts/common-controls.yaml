# Central records for common and hybrid controls — the framework baseline's
# program layer (src/graph/nodes/controlRecords.ts).
#
#   common  written once here and inherited as-is by every system the control
#           applies to (systems without HITRUST in scope; a HITRUST system is
#           assessed on the Cyber Assurance levels instead).
#   hybrid  the method is written here; `systemPart` says what each system must
#           do, and each system records that part in control-records.yaml.
#
# A control not listed here is system-specific, unless its domain is covered by
# an enterprise attestation or the provider, which the engine resolves as before.

- controlId: "GOV-01"
  type: "common"
  ownerId: "grc"
  statement: >
    ACME runs one security, compliance and resilience program for every system, defined in the
    ISMS manual and reviewed by the security steering committee each year.
  status: "implemented"
  frequency: "annual"
  evidence:
    - "ISMS manual v4.2"
    - "FY26 management review minutes"
  reviewedAt: "2026-09-15"
- controlId: "GOV-05"
  type: "common"
  ownerId: "grc"
  statement: >
    Program metrics are reported to the steering committee each quarter. Only half of the
    defined measures have an automated source; the rest are compiled by hand and two have not
    been reported since Q1.
  status: "partial"
  frequency: "quarterly"
  evidence:
    - "Q3 FY26 security metrics pack"
  reviewedAt: "2026-09-15"
- controlId: "GOV-09"
  type: "common"
  ownerId: "grc"
