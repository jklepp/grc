      reason: "KMS Key high-water mark: Unauthorized rotation or deletion could render the platform's data unrecoverable"
    availability:
      score: 92
      reason: "API Gateway high-water mark: Every customer-facing AI feature depends on this single ingress point"
    regulatory:
      score: 95
      reason: "prod-customer-data S3 high-water mark: Restricted-tier PII at rest"
    businessDependency:
      score: 95
      reason: "API Gateway high-water mark: The sole entry point for the AI platform's revenue-generating features"
  userCount: 1842
