# Trust boundaries. hostingType drives which control domains are inherited from the
# provider under the shared-responsibility split.
#
# Generated by scripts/export-facts-to-yaml.mjs. Edit this file, not a TypeScript module.

- id: "SYS-003"
  name: "Production AI Platform"
  env: "Production — AWS"
  hostingType: "cloud"
  provider: "AWS"
  standards:
    - "SOC 2"
    - "ISO 27001"
    # Added alongside the applicability/responsibility rework below: this is
    # ACME's AI platform, and ISO 42001 (the AI management-system standard) is
    # the framework whose clauses actually name the AI-governance, model-risk,
    # and agentic controls this boundary holds. Certifying against SOC 2/ISO
    # 27001 alone left every AAT-domain control not already framework-mapped
    # elsewhere reading as "not applicable," which was false — they apply,
    # nothing had named the standard that says so.
    - "ISO 42001"
  mission: "ACME's core AI product platform — the model-serving, retrieval-augmented generation (RAG),
    and API layer that powers ACME's customer-facing AI features, from the public ingress point down
    through the customer data it draws on to answer queries."
  boundary: "Runs entirely within a dedicated AWS production account, network-isolated from ACME's
    corporate network and other AWS accounts. The boundary covers the API gateway, model-serving and
    RAG compute, the vector store, and the encrypted customer data and metadata stores backing them;
    the upstream applications that call this platform's API are separately owned systems outside
    this boundary."
  connections:
    - "Inbound: authenticated API calls from ACME's customer-facing applications via API Gateway"
    - "Internal: model-serving calls the RAG service, which queries the vector database and metadata
      store"
    - "Encryption: all data at rest protected by a dedicated KMS key; service credentials brokered
      through Secrets Manager"
  roles:
    - role: "System Owner"
      ownerId: "ml-platform-team"
    - role: "Technical Administrator"
      ownerId: "ml-platform-team"
      note: "AWS environment specifically."
    - role: "Security Owner"
      ownerId: "it-security"
    - role: "Data Owner"
      ownerId: "product-leadership"
  syncSource: "vanta"
  lastSynced: "8 min ago"
  oktaEnforced: "compliant"
  mfaEnforced: "compliant"
  internetFacing: true
  availabilityTier: "tier-1-critical"
  userCount: 1842
  regions:
    - "us-east-1"
    - "us-west-2"
  dataProfile:
    subjects:
      - "customers"
      - "end-users"
    approxRecords: 4200000
    retention: "7 years post-contract-termination"
    residency:
      - "United States"
