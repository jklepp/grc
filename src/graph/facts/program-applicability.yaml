- controlId: RSK-06
  appliesWhen: {}
  rationale: Remediating risk to an acceptable level is asked of every system the risk program covers.
- controlId: AAT-07
  appliesWhen:
    assetKinds: &a1
      - model-gateway
      - vector-db
      - tool-gateway
      - policy-service
  rationale: Diverse-perspective risk decision-making applies where AI/autonomous technology actually
    operates in the boundary.
- controlId: AAT-07
  appliesWhen:
    usesAI: true
  rationale: Applies wherever the system uses AI, including through a vendor dependency with no
    AI-kind asset of its own.
- controlId: AAT-10
  appliesWhen:
    assetKinds: *a1
  rationale: TEVV practices apply to systems that host model-serving, retrieval, or agent infrastructure.
- controlId: AAT-10
  appliesWhen:
    usesAI: true
  rationale: Applies wherever the system uses AI, including through a vendor dependency with no
    AI-kind asset of its own.
- controlId: AAT-16
  appliesWhen:
    assetKinds: *a1
  rationale: Monitoring deployed AI behavior applies where AI/autonomous technology is actually deployed.
- controlId: AAT-16
  appliesWhen:
    usesAI: true
  rationale: Applies wherever the system uses AI, including through a vendor dependency with no
