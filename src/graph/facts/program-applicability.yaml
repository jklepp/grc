- controlId: IAO-04
  appliesWhen: {}
  rationale: The requirement to test and remediate flaws during development is a development-process
    obligation, not tied to any one system's runtime characteristics.
- controlId: PRM-07
  appliesWhen: {}
  rationale: Formal change control over the SDLC is a process ACME runs once, governing changes across
