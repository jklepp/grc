- controlId: AAT-17
  appliesWhen:
    assetKinds: *a1
  rationale: Tracking AI-related harm applies where AI/autonomous technology is actually present to cause it.
- controlId: AAT-17
  appliesWhen:
    usesAI: true
  rationale: Applies wherever the system uses AI, including through a vendor dependency with no
    AI-kind asset of its own.
