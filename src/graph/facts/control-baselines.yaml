# Per-tier control baselines — WHICH controls a system at a classification tier
# carries, completing the control profile (control-profile.yaml), which says how
# WELL they must be done. The 800-53 shape: categorize, select the published
# baseline, tailor out with documented justification (control reviews).
#
# Derived by scripts/generate-control-baselines.mjs as the intersection of
# applicable controls across every authored system at the tier — content-
# conditional controls (AI, custom SDLC, single-system certifications) fall to
# the applicability rules as overlays rather than being frozen into policy here.
# Reviewing an edit to this file IS the policy act; the build validates every id
# and that lower tiers stay subsets of higher ones.
#
# A tier with no authored reference system is deliberately absent: the engine
# derives scope for such systems from rules and frameworks exactly as before.

# Public: no authored reference system — no baseline defined.
# Internal: no authored reference system — no baseline defined.
# Confidential: no authored reference system — no baseline defined.
# Restricted — intersection of SYS-003 (Production AI Platform) ∩ SYS-042 (Workday).
# Applicable somewhere at this tier but left to conditional overlays: AAT-10, AAT-16, AAT-17, TDA-20, WEB-03.
