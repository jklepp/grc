- id: PRI-02
  friendlyName: Data Privacy Notice
  scope: program
  domain: Privacy
  category: Data Protection
  name: Data Privacy Notice
  description: >-
    Mechanisms exist to:

    (1) Make data privacy notice(s) available to individuals upon first interacting with an
    organization and subsequently as necessary; 

    (2) Ensure that data privacy notices are clear and easy-to-understand, expressing relevant
    information about how Personal Data (PD) is collected, received, processed, stored, transmitted,
    shared, updated and/or disposed;

    (3) Contain all necessary notice-related criteria required by applicable statutory, regulatory
    and contractual obligations;

    (4) Define the scope of PD processing activities, including the geographic locations and
    third-party recipients that process the PD within the scope of the data privacy notice;

    (5) Periodically, review and update the content of the privacy notice, as necessary; and

    (6) Retain prior versions of the privacy notice, in accordance with data retention requirements.
