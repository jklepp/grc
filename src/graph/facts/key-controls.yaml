# The controls tracked at implementation granularity, as opposed to the ones covered
# only by a category-level assessment. Selected as the material controls for their
# category, which is the argument for giving them parity with everything they don't
# cover. Note that every Governance key control is program-scoped, and that is the
# honest answer rather than an omission: running a risk assessment or governing the AI
# lifecycle is something ACME does once, not something each S3 bucket does separately.
# The consequence is real and worth stating — no asset's Governance category is ever
# control-backed, so every asset carries an 'assessed' basis there, and Model Health
# surfaces that rather than hiding it.
