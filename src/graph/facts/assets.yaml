# ---- SYS-003: the agent platform's own moving parts -----------------------------------
# The gateways above describe how traffic is mediated; these are what it is mediated to.
# The boundary previously jumped straight from the API Gateway to the orchestrator, which
# left the browser app customers actually use, the inference endpoint behind the model
# gateway, and the staff console that edits production prompts outside the register
# entirely — each of them a real control surface with a real blast radius.
#
# AST-003-29's provider is "External Model Provider" rather than a brand, and deliberately
# has no matching row in vendors.yaml. The external party is already modelled once, as
# ACTOR-MODEL-PROVIDER — registering it a second time as a vendor drew the same
# organisation twice on the architecture canvas without adding a fact. `provider` here is
# a display label, which is how Splunk, Okta, Zscaler and Terraform Cloud are carried too.

