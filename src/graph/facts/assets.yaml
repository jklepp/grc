# The resources inside each boundary. `kind` is load-bearing: it is what applicability
# rules match on, so an unknown kind would silently exempt an asset from every control.
#
# systemIds is plural: almost every asset names exactly one system, but a shared
# platform can name more (see AST-003-23, the corporate Okta tenant, which gates
# both Production AI Platform and Workday) — see assemble.ts's assetsBySystem
# fan-out for how that's read back out.

