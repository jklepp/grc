# Enterprise attestations — what ACME's Enterprise Inherited controls actually stand on.
#
# The counterpart to provider-certifications.yaml. INHERITED_DOMAINS
# (src/graph/nodes/systems.ts) says a vendor covers a domain under its own
# certification; this says a central ACME program covers a domain the same way,
# for every system in the register, rather than each system's own team proving
# it independently. The claim only scores because a real internal review backs
# it — src/graph/validate.ts fails the build if a domain is claimed here with
# nothing behind it, the same rule provider certifications are held to.
#
# `evidenceType` is the same seven-value scale every other piece of evidence in
# this graph uses. A self-run program's internal audit sits below the grade the
# engine treats as ACME-verified for the system itself, which is what holds an
# enterprise-inherited control below one this system proved on its own — not a
# penalty for centralizing the work, the honest ceiling on any control ACME
# didn't re-test at the system boundary.

- id: "ATT-AI-GOV-2026"
  program: "Enterprise AI Governance Program"
  ownerOrgId: "grc"
  reportType: "type-2"
  evidenceType: "Auditor examination"
  assessedAt: "2026-04-01"
  validForDays: 365
  domains:
    - "AI & Autonomous Technologies"
  reference: >
    FY26 internal audit of the enterprise AI governance program — model risk
    tiering, use-case intake, and the AI use policy every system serving a
    model or agent inherits from, rather than re-establishing its own.

