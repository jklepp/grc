# Two independent levers, deliberately kept apart. The tier baseline (and its
# high-sensitivity bump) decides what bar a category must CLEAR at a given tier; the
# weights decide how much clearing it COUNTS FOR. Collapsing them into one number is
# what makes a profile impossible to reason about. The baseline ladder is one full 'how
# convincingly can we prove this' step per tier: attest it in a doc, show it, have it
# examined, prove it by machine. highSensitivityCategories (Data Protection, Identity &
# Access, Detection) carry the most direct exposure when a breach involves sensitive
# data, so they are held one notch stricter once data actually becomes sensitive. On
# weights: at the Public tier nothing is secret, so weighting confidentiality controls
# heavily would be measuring the wrong thing — what can still go wrong to public data is
# that it gets altered or goes down, which is why Resilience and Configuration carry it
# there.
#
# Generated by scripts/export-facts-to-yaml.mjs. Edit this file, not a TypeScript module.

categoryWeights:
  Restricted:
    Identity & Access: 25
    Data Protection: 25
    Detection: 15
    Configuration: 15
    Resilience: 10
    Governance: 10
  Confidential:
    Identity & Access: 22
    Data Protection: 22
    Detection: 16
    Configuration: 16
    Resilience: 12
    Governance: 12
  Internal:
    Identity & Access: 18
    Data Protection: 18
    Detection: 17
    Configuration: 17
    Resilience: 15
    Governance: 15
  Public:
    Identity & Access: 12
    Data Protection: 12
    Detection: 17
    Configuration: 20
    Resilience: 22
    Governance: 17
tierBaseline:
  Public:
    maturity: "Policy"
    evidence: "Document"
  Internal:
    maturity: "Procedure"
    evidence: "Screenshot"
  Confidential:
    maturity: "Implemented"
    evidence: "Auditor examination"
  Restricted:
    maturity: "Managed"
    evidence: "Automated technical test"
highSensitivityCategories:
  - "Data Protection"
  - "Identity & Access"
  - "Detection"
bumpedTiers:
  - "Confidential"
  - "Restricted"
