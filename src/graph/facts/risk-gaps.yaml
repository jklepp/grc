# Why a risk names no contributing asset or no holding control. A stated reason rather
# than an empty list, so 'nothing carries this yet' reads as a deliberate position
# instead of an edge someone forgot to author. Validated both ways: a risk with no edges
# needs an entry here, and an entry here for a risk that HAS edges is stale
# documentation.
#
# Generated by scripts/export-facts-to-yaml.mjs. Edit this file, not a TypeScript module.

withoutAssets:
  RISK-004: "A vendor-reassessment backlog is a program condition, not a property of any asset. It's
    held down by TPM-04 at program scope."
  RISK-012: "An untested runbook is a program condition. Held down by IRO-02 at program scope."
  RISK-013: "Physical badge systems at a satellite office are outside this register's boundary — no
    asset here represents them, and inventing one to give the risk an edge would be worse than the
    gap."
withoutControls:
  RISK-013: "No key control covers physical access. Physical & Environmental Security is governed at
    the domain level by SOP-13 rather than tracked as a key control, so this risk's assurance is
    reported as unassessed rather than borrowed from an unrelated control."
